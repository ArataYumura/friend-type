<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>診断結果 - GFAH</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css)" rel="stylesheet">
  <style> body { background-color: #F7FAF9; } </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-center min-h-screen">
  <p class="text-center text-sm font-bold text-indigo-500 mb-1">あなたのフレンドタイプは...</p>
  <h1 class="text-center text-3xl font-extrabold text-slate-800 mb-6">GFAH</h1>
  <div class="w-full max-w-[320px] bg-orange-50 border border-orange-100 rounded-3xl p-4 text-center shadow-sm mb-8">
    <img src="./GFAH.jpeg" class="w-full h-auto rounded-2xl mb-3 shadow-inner" alt="GFAH">
    <p class="text-lg font-black text-slate-800">GFAH：天真爛漫チワワ</p>
  </div>
  <div id="meters-box" class="w-full max-w-md bg-white rounded-3xl shadow-md p-6 space-y-6">
    <div>
      <div class="flex justify-between text-xs font-bold text-slate-500 mb-1"><span>GameChanger (G)</span><span class="text-lime-600 font-extrabold">Balance (B)</span></div>
      <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden relative"><div id="bar-0" class="bg-lime-400 h-full transition-all duration-1000" style="width: 0%"></div></div>
    </div>
    <div>
      <div class="flex justify-between text-xs font-bold text-slate-500 mb-1"><span>Stubborn (S)</span><span class="text-pink-500 font-extrabold">Flexible (F)</span></div>
      <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden relative"><div id="bar-1" class="bg-pink-400 h-full transition-all duration-1000" style="width: 0%"></div></div>
    </div>
    <div>
      <div class="flex justify-between text-xs font-bold text-slate-500 mb-1"><span class="text-sky-500 font-extrabold">Active (A)</span><span>Passive (P)</span></div>
      <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden relative"><div id="bar-2" class="bg-sky-400 h-full transition-all duration-1000" style="width: 0%"></div></div>
    </div>
    <div>
      <div class="flex justify-between text-xs font-bold text-slate-500 mb-1"><span>Harmony (H)</span><span class="text-amber-500 font-extrabold">Discussion (D)</span></div>
      <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden relative"><div id="bar-3" class="bg-amber-400 h-full transition-all duration-1000" style="width: 0%"></div></div>
    </div>
  </div>
  <div class="mt-8"><a href="./index.html" class="px-8 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-full text-sm shadow-sm transition-all inline-flex items-center gap-2"><i class="fa-solid fa-rotate-right"></i> もう一度診断する</a></div>
  <script>
    window.onload = function() {
      var params = new URLSearchParams(window.location.search);
      var g = parseInt(params.get('g')) || 50; var s = parseInt(params.get('s')) || 50; var a = parseInt(params.get('a')) || 50; var h = parseInt(params.get('h')) || 50;
      setTimeout(function() {
        document.getElementById('bar-0').style.width = (100 - g) + '%'; document.getElementById('bar-1').style.width = (100 - s) + '%'; document.getElementById('bar-2').style.width = a + '%'; document.getElementById('bar-3').style.width = (100 - h) + '%';
      }, 300);
    };
  </script>
</body>
</html>
