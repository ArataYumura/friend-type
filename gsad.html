<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>診断結果 - GSAD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style> body { background-color: #F7FAF9; } </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-center min-h-screen">
  <p class="text-center text-sm font-bold text-indigo-500 mb-1">あなたのフレンドタイプは...</p>
  <h1 class="text-center text-3xl font-extrabold text-slate-800 mb-6">GSAD</h1>
  <div class="w-full max-w-[320px] bg-orange-50 border border-orange-100 rounded-3xl p-4 text-center shadow-sm mb-8">
    <img src="./GSAD.jpeg" class="w-full h-auto rounded-2xl mb-3 shadow-inner" alt="GSAD">
    <p class="text-lg font-black text-slate-800">GSAD：暴れん坊ティラノサウルス</p>
  </div>
  <div class="w-full max-w-md mx-auto bg-white rounded-3xl shadow-md p-6 md:p-8 space-y-8 border border-gray-100">
    <div class="space-y-2">
      <div class="flex justify-between text-sm font-bold text-gray-700">
        <span>GameChanger (G)</span>
        <span>Balance (B)</span>
      </div>
      <div class="relative w-full h-3 bg-gradient-to-r from-lime-400 to-lime-500 rounded-full my-4">
        <div id="pin-g" class="absolute top-1/2 -translate-y-1/2 w-5 h-5 bg-white border-4 border-lime-500 rounded-full shadow transition-all duration-1000" style="left: 50%;"></div>
      </div>
      <div class="flex justify-between text-xs font-extrabold text-lime-600">
        <span id="pct-g">-%</span>
        <span id="pct-b">-%</span>
      </div>
    </div>

    <div class="space-y-2">
      <div class="flex justify-between text-sm font-bold text-gray-700">
        <span>Stubborn (S)</span>
        <span>Flexible (F)</span>
      </div>
      <div class="relative w-full h-3 bg-gradient-to-r from-pink-400 to-pink-500 rounded-full my-4">
        <div id="pin-s" class="absolute top-1/2 -translate-y-1/2 w-5 h-5 bg-white border-4 border-pink-500 rounded-full shadow transition-all duration-1000" style="left: 50%;"></div>
      </div>
      <div class="flex justify-between text-xs font-extrabold text-pink-600">
        <span id="pct-s">-%</span>
        <span id="pct-f">-%</span>
      </div>
    </div>

    <div class="space-y-2">
      <div class="flex justify-between text-sm font-bold text-gray-700">
        <span>Active (A)</span>
        <span>Passive (P)</span>
      </div>
      <div class="relative w-full h-3 bg-gradient-to-r from-sky-400 to-sky-500 rounded-full my-4">
        <div id="pin-a" class="absolute top-1/2 -translate-y-1/2 w-5 h-5 bg-white border-4 border-sky-500 rounded-full shadow transition-all duration-1000" style="left: 50%;"></div>
      </div>
      <div class="flex justify-between text-xs font-extrabold text-sky-600">
        <span id="pct-a">-%</span>
        <span id="pct-p">-%</span>
      </div>
    </div>

    <div class="space-y-2">
      <div class="flex justify-between text-sm font-bold text-gray-700">
        <span>Harmony (H)</span>
        <span>Discussion (D)</span>
      </div>
      <div class="relative w-full h-3 bg-gradient-to-r from-amber-400 to-amber-500 rounded-full my-4">
        <div id="pin-h" class="absolute top-1/2 -translate-y-1/2 w-5 h-5 bg-white border-4 border-amber-500 rounded-full shadow transition-all duration-1000" style="left: 50%;"></div>
      </div>
      <div class="flex justify-between text-xs font-extrabold text-amber-600">
        <span id="pct-h">-%</span>
        <span id="pct-d">-%</span>
      </div>
    </div>
  </div>
  <div class="mt-8"><a href="./index.html" class="px-8 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-full text-sm shadow-sm transition-all inline-flex items-center gap-2"><i class="fa-solid fa-rotate-right"></i> もう一度診断する</a></div>
  <script>
    window.onload = function() {
      var params = new URLSearchParams(window.location.search);
      var g = parseInt(params.get('g')) || 50; var s = parseInt(params.get('s')) || 50; var a = parseInt(params.get('a')) || 50; var h = parseInt(params.get('h')) || 50;
      setTimeout(function() {
        document.getElementById('bar-0').style.width = (100 - g) + '%'; document.getElementById('bar-1').style.width = (100 - s) + '%'; document.getElementById('bar-2').style.width = a + '%'; document.getElementById('bar-3').style.width = (100 - h) + '%';
      }, 300);
    };
  </script>
</body>
</html>
</body>
</html>
