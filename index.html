<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フレンドタイプ診断</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #1e3a8a;
            margin-bottom: 20px;
        }
        p {
            color: #4b5563;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👥 フレンドタイプ診断</h1>
    <p>いくつかの簡単な質問に答えるだけで、あなたの人間関係の傾向や「友達の中でのポジション」を分析します！</p>
    
    <button class="btn" onclick="startDiagnosis()">診断をスタートする</button>
</div>

<script>
    function startDiagnosis() {
        alert('診断が始まりました！');
    } // ← ここに閉じカッコを追加しました
</script>
</body>
</html>
